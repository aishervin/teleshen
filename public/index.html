<!doctype html>
<html lang="fa" dir="rtl">
	<head>
		<!-- Basic Page Needs
  –––––––––––––––––––––––––––––––––––––––––––––––––– -->
		<meta charset="utf-8" />
		<title>تلشن - چت ناشناس</title>
		<meta name="description" content="" />
		<meta name="author" content="" />

		<!-- Mobile Specific Metas
  –––––––––––––––––––––––––––––––––––––––––––––––––– -->
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />

		<!-- FONT
  –––––––––––––––––––––––––––––––––––––––––––––––––– -->

		<!-- CSS
  –––––––––––––––––––––––––––––––––––––––––––––––––– -->
		<style>
			:root {
				--bg-color: #121212;
				--chat-bg: #1e1e1e;
				--input-bg: #2c2c2c;
				--text-color: #ffffff;
				--accent-color: #0088cc;
				--error-color: #ff5252;
				--font-family: 'Tahoma', 'Segoe UI', sans-serif;
			}

			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
				outline: none;
				-webkit-tap-highlight-color: transparent;
			}

			body {
				font-family: var(--font-family);
				background-color: var(--bg-color);
				color: var(--text-color);
				height: 100vh;
				width: 100vw;
				overflow: hidden;
				display: flex;
				flex-direction: column;
			}

			/* --- Login Screen --- */
			#login-screen {
				position: fixed;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				background: rgba(0, 0, 0, 0.95);
				z-index: 1000;
				display: flex;
				flex-direction: column;
				justify-content: center;
				align-items: center;
				backdrop-filter: blur(5px);
			}

			.login-box {
				background: var(--chat-bg);
				padding: 2rem;
				border-radius: 20px;
				text-align: center;
				width: 90%;
				max-width: 400px;
				box-shadow: 0 10px 30px rgba(0,0,0,0.5);
			}

			.login-box h2 {
				margin-bottom: 1.5rem;
				color: var(--accent-color);
			}

			.login-input {
				width: 100%;
				padding: 15px;
				border-radius: 12px;
				border: 2px solid #333;
				background: var(--input-bg);
				color: white;
				font-size: 1rem;
				margin-bottom: 1rem;
				text-align: center;
				transition: border-color 0.3s;
			}

			.login-input:focus {
				border-color: var(--accent-color);
			}

			.login-btn {
				width: 100%;
				padding: 15px;
				border-radius: 12px;
				border: none;
				background: var(--accent-color);
				color: white;
				font-size: 1.1rem;
				font-weight: bold;
				cursor: pointer;
				transition: transform 0.1s;
			}

			.login-btn:active {
				transform: scale(0.98);
			}

			/* --- Chat Interface --- */
			#chat-container {
				display: none;
				flex-direction: column;
				height: 100%;
				width: 100%;
				max-width: 800px;
				margin: 0 auto;
				background: var(--chat-bg);
				position: relative;
			}

			/* Header */
			header {
				padding: 15px;
				background: rgba(30, 30, 30, 0.95);
				border-bottom: 1px solid #333;
				display: flex;
				justify-content: space-between;
				align-items: center;
				z-index: 10;
				backdrop-filter: blur(5px);
			}

			.room-info {
				font-size: 0.9rem;
				color: #aaa;
			}

			.online-count {
				background: #2ecc71;
				color: #000;
				padding: 4px 10px;
				border-radius: 20px;
				font-size: 0.8rem;
				font-weight: bold;
				display: flex;
				align-items: center;
				gap: 5px;
			}

			.online-dot {
				width: 8px;
				height: 8px;
				background: #000;
				border-radius: 50%;
				animation: pulse 1.5s infinite;
			}

			@keyframes pulse {
				0% { opacity: 1; }
				50% { opacity: 0.5; }
				100% { opacity: 1; }
			}

			/* Messages Area */
			#messages-wrapper {
				flex: 1;
				overflow: hidden;
				position: relative;
				display: flex;
				flex-direction: column-reverse;
				padding: 20px;
				
				-webkit-mask-image: linear-gradient(
					to bottom,
					transparent 0%,
					black 15%,
					black 85%,
					transparent 100%
				);
				mask-image: linear-gradient(
					to bottom,
					transparent 0%,
					black 15%,
					black 85%,
					transparent 100%
				);
			}

			.message-row {
				width: 100%;
				display: flex;
				justify-content: flex-start;
				margin-bottom: 8px;
				animation: slideUp 0.3s ease-out;
			}

			@keyframes slideUp {
				from { transform: translateY(20px); opacity: 0; }
				to { transform: translateY(0); opacity: 1; }
			}

			.message-bubble {
				max-width: 80%;
				padding: 12px 18px;
				border-radius: 20px;
				font-size: 0.95rem;
				line-height: 1.5;
				word-wrap: break-word;
				position: relative;
				box-shadow: 0 2px 5px rgba(0,0,0,0.2);
			}

			.message-name {
				font-size: 0.75rem;
				margin-bottom: 4px;
				opacity: 0.8;
				font-weight: bold;
				display: block;
			}

			.message-text {
				display: block;
			}

			.my-message {
				justify-content: flex-end;
			}
			
			.my-message .message-bubble {
				background: var(--accent-color) !important;
				color: white;
				border-bottom-left-radius: 4px;
			}

			.other-message .message-bubble {
				border-bottom-right-radius: 4px;
			}

			/* Input Area */
			#input-area {
				padding: 15px;
				background: var(--chat-bg);
				border-top: 1px solid #333;
				display: flex;
				gap: 10px;
				z-index: 10;
			}

			#message-input {
				flex: 1;
				padding: 12px 15px;
				border-radius: 25px;
				border: 1px solid #444;
				background: var(--input-bg);
				color: white;
				font-family: inherit;
				font-size: 1rem;
			}

			#send-btn {
				width: 50px;
				height: 50px;
				border-radius: 50%;
				border: none;
				background: var(--accent-color);
				color: white;
				font-size: 1.2rem;
				cursor: pointer;
				display: flex;
				align-items: center;
				justify-content: center;
				transition: all 0.2s;
			}

			#send-btn:disabled {
				background: #444;
				cursor: not-allowed;
				opacity: 0.7;
			}

			#timer-display {
				position: absolute;
				top: -30px;
				left: 50%;
				transform: translateX(-50%);
				background: var(--error-color);
				color: white;
				padding: 4px 12px;
				border-radius: 12px;
				font-size: 0.8rem;
				font-weight: bold;
				opacity: 0;
				transition: opacity 0.3s;
				pointer-events: none;
			}

			.timer-active {
				opacity: 1 !important;
			}

			/* Scrollbar hiding */
			::-webkit-scrollbar {
				width: 0px;
				background: transparent;
			}
		</style>

		<!-- Favicon
  –––––––––––––––––––––––––––––––––––––––––––––––––– -->
		<link rel="icon" type="image/ico" href="favicon.ico" />
		<script type="module" src="/dist/index.js"></script>
	</head>
	<body>
		<div id="root"></div>
	</body>
</html>
