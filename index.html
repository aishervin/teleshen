<!doctype html>
<html lang="en">
	<head>
		<!-- Basic Page Needs -->
		<meta charset="utf-8" />
		<title>Chat!</title>
		<meta name="description" content="" />
		<meta name="author" content="" />

		<!-- Mobile Specific Metas -->
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- CSS -->
		<link rel="stylesheet" href="css/normalize.css" />
		<link rel="stylesheet" href="css/skeleton.css" />
		
		<!-- Your custom styles (merged from styles.css) -->
		<style>
			body,
			html {
				height: 100%;
				margin: 0;
				padding: 0;
				display: flex;
				flex-direction: column;
			}

			.chat {
				padding-top: 40px;
			}

			#root {
				flex: 1;
				display: flex;
				flex-direction: column;
				justify-content: flex-end;
				overflow-y: auto;
				height: 100%;
				/* padding: 10px; */
			}

			.message {
				margin-bottom: 10px;
			}

			.message .user {
				font-weight: bold;
				text-align: right;
			}

			.message .remove {
				position: absolute;
				width: 22px;
				height: 20px;
				left: -60px;
				/* display: "block", */
				display: none;
				padding: 0;
				line-height: 18px;
				border: none; /* fixed quotes */
			}

			.send-message {
				padding: 0;
			}

			.my-input-text::placeholder {
				color: #ccc;
			}
		</style>

		<!-- Favicon -->
		<link rel="icon" type="image/ico" href="favicon.ico" />
		
		<!-- JavaScript (unchanged) -->
		<script src="/dist/index.js" type="module"></script>
	</head>
	<body>
		<!-- Primary Page Layout -->
		<div class="container" style="width: 95%; height: 100%">
			<div class="row" style="height: 100%">
				<div class="one-third column" style="margin-top: 25%">
					<h4><b>Chat</b>, powered by Durable Objects</h4>
					<p>
						This chat room is hosted in a single Durable Object, running in one
						process in one machine in one location, very close to the users.
					</p>
				</div>
				<div class="two-thirds column" id="root"></div>
			</div>
		</div>
	</body>
</html>
