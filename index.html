<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teleshen Chat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      height: 100%;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f0f;
      color: #eee;
      display: flex;
      flex-direction: column;
    }
    #header {
      padding: 14px 20px;
      background: #1a1a1a;
      border-bottom: 1px solid #333;
      font-weight: bold;
      font-size: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #status { font-size: 12px; font-weight: normal; }
    #status.connected { color: #22c55e; }
    #status.disconnected { color: #ef4444; }
    #root {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .message {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 14px;
      word-wrap: break-word;
      line-height: 1.5;
    }
    .message .user {
      font-size: 12px;
      font-weight: bold;
      opacity: 0.7;
      margin-bottom: 4px;
    }
    .message.user { background: #2563eb; align-self: flex-start; }
    .message.assistant { background: #1e293b; align-self: flex-end; }
    .send-message {
      display: flex;
      gap: 8px;
      padding: 12px 20px;
      background: #1a1a1a;
      border-top: 1px solid #333;
    }
    .send-message input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #444;
      border-radius: 10px;
      background: #0f0f0f;
      color: #eee;
      font-size: 15px;
    }
    .send-message input:focus { outline: none; border-color: #2563eb; }
    .send-message button {
      padding: 12px 24px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
    }
    .send-message button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div id="header">
    Teleshen Chat
    <span id="status" class="disconnected">قطع</span>
  </div>
  <div id="root"></div>
  <div class="send-message">
    <input id="input" placeholder="پیام بنویس..." autocomplete="off">
    <button id="send" onclick="sendMessage()">ارسال</button>
  </div>

  <script>
    const WS_URL = "wss://teleshen.shervin003254024.workers.dev/parties/chat/main";
    const root = document.getElementById("root");
    const input = document.getElementById("input");
    const statusEl = document.getElementById("status");
    let ws;

    function connect() {
      ws = new WebSocket(WS_URL);
      ws.onopen = () => {
        statusEl.textContent = "متصل";
        statusEl.className = "connected";
      };
      ws.onmessage = (e) => {
        const data = JSON.parse(e.data);
        if (data.type === "all") {
          root.innerHTML = "";
          (data.messages || []).forEach(appendMessage);
        } else if (data.type === "add" || data.type === "update") {
          appendMessage(data);
        }
      };
      ws.onclose = () => {
        statusEl.textContent = "قطع";
        statusEl.className = "disconnected";
        setTimeout(connect, 3000);
      };
      ws.onerror = () => ws.close();
    }

    function appendMessage(m) {
      const div = document.createElement("div");
      div.className = "message " + (m.role || "user");
      const user = document.createElement("div");
      user.className = "user";
      user.textContent = m.user || m.role || "user";
      const content = document.createElement("div");
      content.textContent = m.content;
      div.appendChild(user);
      div.appendChild(content);
      root.appendChild(div);
      root.scrollTop = root.scrollHeight;
    }

    function sendMessage() {
      const text = input.value.trim();
      if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({
        type: "add",
        id: crypto.randomUUID(),
        user: "me",
        role: "user",
        content: text
      }));
      input.value = "";
    }

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    connect();
  </script>
</body>
</html>
